# CONFIG_BT_LL_SW_LLCP_LEGACY=y

# Low-latency Bluetooth parameters
# 7.5 ms minimum connection interval
# CONFIG_BT_PERIPHERAL_PREF_MIN_INT=6
# 11.25 ms maximum connection interval
# CONFIG_BT_PERIPHERAL_PREF_MAX_INT=9
# CONFIG_BT_PERIPHERAL_PREF_LATENCY=0
# CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=400

# If your board supports it, you can enable the controller low-latency option.
# Uncomment the next line if it builds cleanly for your MCU.
# CONFIG_BT_CTLR_LOW_LAT is not set


# Time before we insist on updated params (seconds)
# CONFIG_BT_CONN_PARAM_UPDATE_TIMEOUT=2


# TX power and battery reporting (preserved from previous config)
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
CONFIG_ZMK_BATTERY_REPORT_INTERVAL=60

# 启用键盘RGB功能
# CONFIG_ZMK_RGB_UNDERGLOW=y
# CONFIG_WS2812_STRIP=y
# CONFIG_LED_STRIP=y
# CONFIG_ZMK_RGB_UNDERGLOW_ON_START=y
# CONFIG_ZMK_RGB_UNDERGLOW_EFF_START=3

CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=3600000




