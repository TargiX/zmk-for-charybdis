# CONFIG_BT_LL_SW_LLCP_LEGACY=y

# Low-latency Bluetooth parameters
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=6      # 7.5 ms
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=9      # 11.25 ms
CONFIG_BT_PERIPHERAL_PREF_LATENCY=0
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=400    # 4 s supervision timeout

# Controller tuned for latency rather than power
CONFIG_BT_CTLR_LOW_LAT=y
CONFIG_BT_MAX_CONN=1                     # only one host at a time ⇒ tighter timing

# Make sure ZMK never renegotiates slower
CONFIG_BT_CONN_PARAM_UPDATE_TIMEOUT=2    # seconds before we insist on our params

# Keep the keyboard awake so the link stays active
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=600000     # 10 min

# TX power and battery reporting (preserved from previous config)
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
CONFIG_ZMK_BATTERY_REPORT_INTERVAL=60

