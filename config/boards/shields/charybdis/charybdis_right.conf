CONFIG_SPI=y

CONFIG_INPUT=y
CONFIG_ZMK_POINTING=y

CONFIG_ZMK_EXT_POWER=y

CONFIG_PMW3610_ALT=y
CONFIG_PMW3610_ALT_INIT_POWER_UP_EXTRA_DELAY_MS=1000
CONFIG_PMW3610_ALT_SMART_ALGORITHM=n

# Keep the sensor in responsive modes much longer if ZMK ever enters idle.
CONFIG_PMW3610_ALT_RUN_DOWNSHIFT_TIME_MS=3264
CONFIG_PMW3610_ALT_REST1_DOWNSHIFT_TIME_MS=60000
CONFIG_PMW3610_ALT_REST2_DOWNSHIFT_TIME_MS=120000

# Increase battery report interval to 3 minutes to debug interference
CONFIG_ZMK_BATTERY_REPORT_INTERVAL=180

# Report every sample instead of accumulating deltas into a burst.
CONFIG_PMW3610_ALT_REPORT_INTERVAL_MIN=0

# CONFIG_EC11=y
# CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y
