CONFIG_SPI=y

CONFIG_INPUT=y
CONFIG_ZMK_POINTING=y

CONFIG_ZMK_EXT_POWER=y

CONFIG_PMW3610_ALT=y
CONFIG_PMW3610_ALT_INIT_POWER_UP_EXTRA_DELAY_MS=1000

# Increase battery report interval to 3 minutes to debug interference
CONFIG_ZMK_BATTERY_REPORT_INTERVAL=180

# Stabilize report rate for Bluetooth
CONFIG_PMW3610_ALT_REPORT_INTERVAL_MIN=12

# Drop physically implausible single-sample spikes from the trackball.
CONFIG_PMW3610_ALT_MOTION_DELTA_MAX=512

# CONFIG_EC11=y
# CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y
