CONFIG_SPI=y

CONFIG_INPUT=y
CONFIG_ZMK_POINTING=y

CONFIG_ZMK_EXT_POWER=y

CONFIG_PMW3610_ALT=y
CONFIG_PMW3610_ALT_INIT_POWER_UP_EXTRA_DELAY_MS=1000

# Report each PMW3610 sample immediately instead of accumulating deltas.
CONFIG_PMW3610_ALT_REPORT_INTERVAL_MIN=0

# Drop physically implausible single-sample spikes from the trackball.
# At 800 CPI, 512 counts/burst = 0.64" of ball travel in one 4 ms sample —
# impossible; real motion stays under ~300 counts/burst.
CONFIG_PMW3610_ALT_MOTION_DELTA_MAX=512

# CONFIG_EC11=y
# CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y
